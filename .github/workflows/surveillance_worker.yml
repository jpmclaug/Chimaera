name: Chimaera Market Surveillance Worker

on:
  schedule:
    # Runs every 6 hours starting at 5:00 AM EDT (09:00 UTC)
    # 09:00 UTC = 5:00 AM EDT
    # 15:00 UTC = 11:00 AM EDT
    # 21:00 UTC = 5:00 PM EDT
    # 03:00 UTC = 11:00 PM EDT
    - cron: '0 3,9,15,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  surveillance-sweep:
    name: Run Price Surveillance Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Surveillance Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python worker.py --once
