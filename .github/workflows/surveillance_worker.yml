name: Chimaera Market Surveillance Worker

on:
  schedule:
    # Runs every 6 hours at an off-peak minute (:17) to prevent GitHub Actions scheduler queue delays:
    # 03:17 UTC = 11:17 PM EDT
    # 09:17 UTC = 5:17 AM EDT
    # 15:17 UTC = 11:17 AM EDT
    # 21:17 UTC = 5:17 PM EDT
    - cron: '17 3,9,15,21 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  surveillance-sweep:
    name: Run Price Surveillance Sweep
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Surveillance Worker
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          EBAY_APP_ID: ${{ secrets.EBAY_APP_ID }}
          EBAY_CLIENT_ID: ${{ secrets.EBAY_CLIENT_ID }}
          EBAY_CLIENT_SECRET: ${{ secrets.EBAY_CLIENT_SECRET }}
          PYTHONUNBUFFERED: "1"
        run: |
          python worker.py --once
